name: publish

# Триггер — тег вида v1.2.3 (пуш тега или релиз через workflow_dispatch для
# ручного перезапуска без нового тега, например если сборка одной платформы
# упала, а остальные прошли).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      # fail-fast: false — падение сборки на одной платформе не должно
      # обрывать остальные: Windows и обе архитектуры macOS независимы, и
      # частичный релиз (например, только Windows) лучше, чем никакого.
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          # Native Windows ARM64; portable only, no additional installer.
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc --no-bundle'
          # Apple Silicon (M1 и новее) — основной таргет.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Intel Mac — на случай, если у кого-то в команде такой.
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '') }}

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MeetRec ${{ github.ref_name }}'
          releaseBody: |
            Сборки Windows (x64 NSIS-установщик + x64/ARM64 portable .exe без установки) и macOS
            (.dmg, Apple Silicon и Intel отдельно).

            macOS-сборка без подписи Apple Developer ID (`signingIdentity: "-"`,
            ad-hoc) — при первом запуске Gatekeeper потребует явного разрешения:
            правый клик по приложению → «Открыть», либо
            `xattr -cr /Applications/MeetRec.app`.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # ARM64's --no-bundle output is uploaded directly by tauri-action.
          # Keep the existing x64 upload step and macOS asset names unchanged.
          uploadPlainBinary: ${{ matrix.platform == 'windows-11-arm' }}
          releaseAssetNamePattern: ${{ matrix.platform == 'windows-11-arm' && format('MeetRec_{0}_arm64-portable[ext]', github.ref_name) || '' }}

      # У Tauri нет отдельного "portable"-таргета бандлера (только nsis/msi —
      # оба ставят инсталлятором), но собранный `cargo build --release` бинарь
      # и так самодостаточен: фронтенд (`ui/`) и иконка уже вкомпилированы,
      # никаких файлов рядом ему не нужно — это и есть portable-режим, просто
      # без отдельной сборки под него. Докладываем его в тот же релиз вручную,
      # только на Windows job — на macOS у portable нет смысла: неподписанный
      # голый бинарь Gatekeeper блокирует так же, как и .app, но без диалога
      # «Открыть», которым это обходится.
      - name: upload portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp target/release/meeting-recorder-gui.exe "MeetRec_${{ github.ref_name }}_x64-portable.exe"
          gh release upload "${{ github.ref_name }}" "MeetRec_${{ github.ref_name }}_x64-portable.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
