name: publish

# Триггер — тег вида v1.2.3 (пуш тега или релиз через workflow_dispatch для
# ручного перезапуска без нового тега, например если сборка одной платформы
# упала, а остальные прошли).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      # fail-fast: false — падение сборки на одной платформе не должно
      # обрывать остальные: Windows и обе архитектуры macOS независимы, и
      # частичный релиз (например, только Windows) лучше, чем никакого.
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          # Native Windows ARM64; portable only, no additional installer.
          - platform: 'windows-11-arm'
            target: 'aarch64-pc-windows-msvc'
            args: '--target aarch64-pc-windows-msvc --no-bundle'
          # Apple Silicon (M1 и новее) — основной таргет.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # Intel Mac — на случай, если у кого-то в команде такой.
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '') }}

      - name: install frontend dependencies
        run: npm ci

      - name: frontend tests
        run: |
          npm run test:callabo-ui
          npm run test:recorder-ui

      - name: Rust tests
        run: cargo test --workspace --locked

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MeetRec ${{ github.ref_name }}'
          releaseBody: |
            First release of quadr's MeetRec fork, based on the original MeetRec by Cypher Products.

            - Record microphone and system audio as separate channels in one WAV, with independent mute controls.
            - Upload recordings to Callabo from a visible branded action; distinguish upload progress from remote processing.
            - Link recordings to Callabo titles and summaries, with cached results, refresh, and direct record links.
            - Render Markdown summaries with headings, lists, tables and code. Collapsed cards show only an explicit one-line summary.
            - Remove built-in transcription. Processing is available through manual Callabo uploads.
            - Add Windows ARM64 portable builds and single-instance window restoration.
            - Check this fork for future updates.

            Downloads: Windows x64 installer or portable EXE; Windows ARM64 portable EXE; macOS Apple Silicon or Intel DMG.
            Callabo PAT storage is currently implemented on Windows only. Uploads require a Callabo account with API permissions.
            macOS builds are ad-hoc signed, without Apple Developer ID notarization; Gatekeeper may require explicit permission to open the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # ARM64's --no-bundle output is uploaded directly by tauri-action.
          # Keep the existing x64 upload step and macOS asset names unchanged.
          uploadPlainBinary: ${{ matrix.platform == 'windows-11-arm' }}
          releaseAssetNamePattern: ${{ matrix.platform == 'windows-11-arm' && format('MeetRec_{0}_arm64-portable[ext]', github.ref_name) || '' }}

      # У Tauri нет отдельного "portable"-таргета бандлера (только nsis/msi —
      # оба ставят инсталлятором), но собранный `cargo build --release` бинарь
      # и так самодостаточен: фронтенд (`ui/`) и иконка уже вкомпилированы,
      # никаких файлов рядом ему не нужно — это и есть portable-режим, просто
      # без отдельной сборки под него. Докладываем его в тот же релиз вручную,
      # только на Windows job — на macOS у portable нет смысла: неподписанный
      # голый бинарь Gatekeeper блокирует так же, как и .app, но без диалога
      # «Открыть», которым это обходится.
      - name: upload portable exe (Windows only)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cp target/release/meeting-recorder-gui.exe "MeetRec_${{ github.ref_name }}_x64-portable.exe"
          gh release upload "${{ github.ref_name }}" "MeetRec_${{ github.ref_name }}_x64-portable.exe" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
