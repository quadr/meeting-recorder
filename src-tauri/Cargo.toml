[package]
name = "meeting-recorder-gui"
version = "0.1.0"
edition = "2021"
description = "Трей, тост-предложение, глобальный хоткей и окно со списком записей"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Ядро. Отсюда берутся App, WindowsDetector, poll_to_event — ровно те же, что
# крутит консольный бинарь: GUI не имеет своей копии логики записи.
meeting-recorder = { path = ".." }
# `macos-private-api` — ради прозрачного фона всплывашки: на macOS Tauri
# отдаёт `transparent: true` только с этим флагом (иначе окно падает с явной
# ошибкой при создании). Скруглённые углы плашки рисует CSS, а без прозрачности
# вокруг них остался бы чёрный прямоугольник окна.
# `image-png` — только ради загрузки готовой PNG-иконки покоя трея
# (`icons/tray.png`) через `Image::from_bytes`; сами активные состояния
# (идёт запись, взвод, отказ) по-прежнему рисуются кодом.
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Персистентный лог GUI: раньше ошибки захвата уходили в eprintln! stderr,
# у которого нет консоли, — то есть в никуда. LogDir пишет в файл на диске,
# Stdout сохраняет то же поведение для запуска из терминала при отладке.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
# Stream the original WAV to Callabo from an open file handle.
reqwest = { version = "0.12", features = ["json", "stream"] }
uuid = { version = "1", features = ["v4"] }
# Async Callabo file transfer and loopback protocol tests.
tokio = { version = "1", features = ["time", "fs", "macros", "io-util", "net"] }
thiserror = "2"
sys-locale = "0.3.2"
# `coinit_apartmentthreaded` — не украшение, а обязательное условие сборки под
# Windows: без одной из двух coinit-фич в `trash/src/windows.rs` срабатывает
# намеренная ошибка компиляции. Обе входят в `default` крейта, поэтому
# `default-features = false` (взят, чтобы не тянуть его фичу `chrono`) срезал
# заодно и COM. Модель — та же, что крейт выбирает по умолчанию, и та, которую
# ждут shell-API Windows. Сторожит тест `trash_объявлен_с_моделью_com_для_windows`.
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }
# Recording timestamps in the Callabo payload.
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

# Прямой доступ к NSWindow всплывашки. Нужен ровно для двух вещей, которых ни
# Tauri, ни tao не отдают: поведение окна на рабочих столах (жить на всех и
# показываться поверх полноэкранных приложений) и уровень окна.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
